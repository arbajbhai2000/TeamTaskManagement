name: TeamTaskManagement CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore TeamTaskManagement.sln

      - name: Build .NET solution
        run: dotnet build TeamTaskManagement.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TeamTaskManagement.sln --configuration Release --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Frontend/team-task-management-ui
        run: npm install

      - name: Build frontend
        working-directory: Frontend/team-task-management-ui
        run: npm run build