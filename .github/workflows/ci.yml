name: TeamTaskManagement CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TeamTask@12345
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd
          -S localhost,1433
          -U sa
          -P TeamTask@12345
          -C
          -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TeamTaskManagementDB;User Id=sa;Password=TeamTask@12345;TrustServerCertificate=True"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore TeamTaskManagement.sln

      - name: Build .NET solution
        run: dotnet build TeamTaskManagement.sln --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.10

      - name: Apply database migrations
        run: |
          dotnet ef database update \
            --project Infrastructure \
            --startup-project TeamTaskManagement \
            --connection "Server=localhost,1433;Database=TeamTaskManagementDB;User Id=sa;Password=TeamTask@12345;TrustServerCertificate=True"

      - name: Run tests
        run: dotnet test TeamTaskManagement.sln --configuration Release --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Frontend/team-task-management-ui
        run: npm install

      - name: Build frontend
        working-directory: Frontend/team-task-management-ui
        run: npm run build